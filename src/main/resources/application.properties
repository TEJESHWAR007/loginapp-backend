spring.application.name=backend
server.port=${PORT:8081}

# MySQL database configuration (Supports Railway MySQL variables, standard SPRING_DATASOURCE_*, and local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:jwtauthdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:1234}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:ZmMyNWM4ZmQ0YjE3ZjQxOTNkNGE1ZDY2ZjA4YzY2ZmZjMjVjOGZkNGIxN2Y0MTkzZDRhNWQ2NmYwOGM2NmY=}}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Frontend origin allowed for CORS (comma-separated list of URLs or * for all)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:*}}
